name: Registrar precios

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas: juegos con descuento
    - cron: "41 3 * * *" # una vez al día: toda la tienda
  workflow_dispatch:
    inputs:
      mode:
        description: "sales = solo ofertas, full = toda la tienda"
        type: choice
        options: [sales, full]
        default: sales

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Anotar precios de Steam
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '41 3 * * *' && 'full' || 'sales') }}
          COUNTRIES: MX
        run: node record.mjs

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data lows meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios de precio."
            exit 0
          fi
          git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
